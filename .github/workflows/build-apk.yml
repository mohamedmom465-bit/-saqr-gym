      - name: فرض السدك 36 على كل المكتبات (احتياطي)
        run: |
          python3 - <<'PY'
          import os

          kts_path = 'android/build.gradle.kts'
          groovy_path = 'android/build.gradle'

          if os.path.exists(kts_path):
              p = kts_path
              extra = """
allprojects {
    afterEvaluate {
        if (project.hasProperty("android")) {
            val ext = project.extensions.findByName("android")
            if (ext != null) {
                val method = ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)
                method.invoke(ext, 36)
            }
        }
    }
}
"""
          elif os.path.exists(groovy_path):
              p = groovy_path
              extra = """
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}
"""
          else:
              p = None

          if p:
              s = open(p, encoding='utf-8').read()
              if 'compileSdkVersion' not in s and 'setCompileSdkVersion' not in s:
                  s += extra
                  open(p, 'w', encoding='utf-8').write(s)
                  print('تمت الإضافة في', p)
              else:
                  print('موجود بالفعل في', p)
          else:
              print('مفيش ملف android/build.gradle موجود')
          PY
